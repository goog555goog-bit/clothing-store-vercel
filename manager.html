<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>อนุมัติใบเบิก — EMETIX STORE</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest" defer></script>
  <link rel="stylesheet" href="style.css">
  <script src="api.js"></script>
  <script>
    function refreshIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }
    function loadAuditLogs() { console.info('Audit Logs not available in Manager view'); }

    function escapeHTML(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</head>

<body>

  <header class="app-header">
    <div class="container header-container">
      <div class="logo" onclick="navigateTo(scriptUrl)">
        <div class="logo-icon"><i data-lucide="shield-check"></i></div>
        <span style="font-size:1.35rem;font-weight:800;letter-spacing:-1px;color:#fff;"> YY <span
            style="font-weight:300;opacity:0.6;color:var(--primary);">MANAGER</span></span>
      </div>
      <div class="nav-actions">
        <div id="mgrName" class="hide-mobile"
          style="color:var(--text2); font-weight: 500; font-size: 0.9rem; background: var(--surface); padding: 0.4rem 1rem; border-radius: 99px; border: 1px solid var(--border);">
        </div>
        <button class="btn btn-ghost btn-sm" onclick="toggleDarkMode()" aria-label="สลับโหมดมืด/สว่าง">
          <span id="darkModeIcon" class="force-show"><i data-lucide="moon"></i></span>
        </button>
        <button class="btn btn-ghost btn-sm" onclick="navigateTo(scriptUrl)"><i data-lucide="shopping-bag"></i> <span
            class="hide-mobile">หน้าร้าน</span></button>
        <button id="adminPaneBtn" class="btn btn-accent btn-sm hidden" onclick="navigateTo('admin.html')"><i
            data-lucide="shield-check"></i> แอดมิน</button>
        <button class="btn btn-outline btn-sm" onclick="mgrLogout()"
          style="color: var(--danger); border-color: rgba(239, 68, 68, 0.2);" aria-label="ออกจากระบบ"><i
            data-lucide="log-out"></i></button>
      </div>
    </div>
  </header>


  <div class="container" style="padding:1.5rem 0">
    <h2 style="font-size:1.3rem;font-weight:700;margin-bottom:1.5rem;display:flex;align-items:center;gap:0.5rem"><i
        data-lucide="clipboard-list"></i> ใบเบิกรออนุมัติ</h2>

    <div id="pendingList">
      <div class="text-center" style="padding:3rem">
        <div class="spinner"></div>
        <p style="margin-top:1rem;color:var(--text3)">กำลังโหลด...</p>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Nav (Manager) -->
  <nav class="mobile-nav" style="border-top: 1px solid var(--glass-border); background: rgba(5, 5, 5, 0.9);">
    <button class="mobile-nav-item active" onclick="loadPending()">
      <i data-lucide="clipboard-list"></i>
      <span>รออนุมัติ</span>
    </button>
    <button id="mgrMobileAdmin" class="mobile-nav-item hidden" onclick="navigateTo('admin.html')">
      <i data-lucide="shield-check"></i>
      <span>แอดมิน</span>
    </button>
    <button class="mobile-nav-item" onclick="navigateTo(scriptUrl)">
      <i data-lucide="shopping-bag"></i>
      <span>หน้าร้าน</span>
    </button>
    <button class="mobile-nav-item" onclick="mgrLogout()" style="color: var(--danger);">
      <i data-lucide="log-out"></i>
      <span>ออก</span>
    </button>
  </nav>

  <!-- Approve/Reject Modal -->
  <div id="decisionModal" class="modal-overlay" onclick="if(event.target===this) closeMgrModal()">
    <div class="modal">
      <div class="modal-header">
        <div id="decisionTitle" style="font-weight:600">อนุมัติใบเบิก</div>
        <button class="btn btn-ghost btn-sm" onclick="closeMgrModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="decisionItems" style="margin-bottom:1rem"></div>
        <div class="form-group">
          <label class="form-label">ความคิดเห็น (ไม่จำเป็น)</label>
          <input id="decisionComment" class="form-input" placeholder="ระบุความคิดเห็น...">
        </div>
      </div>
      <div class="modal-footer flex-wrap">
        <button class="btn btn-outline" onclick="closeMgrModal()">ยกเลิก</button>
        <button id="decisionBtn" class="btn btn-primary" onclick="submitDecision()">ยืนยัน</button>
      </div>
    </div>
  </div>

  <div id="globalLoader" class="global-loader">
    <div class="spinner"></div>
    <p style="margin-top:1rem;color:var(--text2);font-size:0.9rem">กำลังรวบรวมใบเบิกมาให้ครับ...</p>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    var scriptUrl = 'index.html';
    var currentUser = null;
    var pendingDecision = null; // { orderId, action: 'approve'|'reject' }

    function navigateTo(url) {
      if (document.getElementById('globalLoader')) {
        document.getElementById('globalLoader').classList.add('active');
      }
      if (url.includes('?page=login')) url = 'login.html';
      else if (url.includes('?page=manager')) url = 'manager.html';
      else if (url.includes('?page=admin')) url = 'admin.html';
      else if (url.includes('?page=scanner')) url = 'scanner.html';
      else if (url === scriptUrl) url = 'index.html';
      window.top.location.href = url;
    }

    function initDarkMode() {
      var isDark = localStorage.getItem('darkMode') === 'true';
      if (isDark) {
        document.body.classList.add('dark-mode');
        updateDarkModeUI(true);
      }
    }

    function toggleDarkMode() {
      var isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', isDark);
      updateDarkModeUI(isDark);
      refreshIcons();
    }

    function updateDarkModeUI(isDark) {
      var icon = document.getElementById('darkModeIcon');
      if (icon) icon.innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
    }

    window.onload = function () {
      initDarkMode();
      if (typeof API !== 'undefined') {
        initManager();
      } else {
        var checkCount = 0;
        var checkTimer = setInterval(function () {
          checkCount++;
          if (typeof API !== 'undefined') {
            clearInterval(checkTimer);
            initManager();
          } else if (checkCount > 50) {
            clearInterval(checkTimer);
            showToast('เชื่อมต่อ API ไม่สำเร็จ กรุณารีเฟรช', 'error');
          }
        }, 100);
      }
    };

    function initManager() {
      var stored = localStorage.getItem('_user');
      if (stored) {
        try { currentUser = JSON.parse(stored); } catch (e) { }
      }

      if (!currentUser) {
        var loginUrl = window.location.hostname.indexOf('script.google.com') !== -1
          ? (typeof scriptUrl !== 'undefined' ? scriptUrl + '?page=login' : '?page=login')
          : 'login.html';
        window.location.href = loginUrl;
        return;
      }

      // ตรวจสอบสิทธิ์การเข้าถึงหน้า Manager (สิทธิ์อนุมัติใบเบิก หรือ มีทีม)
      var hasTeam = currentUser && currentUser.teamId;
      if (!API.hasPermission(API.PERMS.APPROVE_REQUEST) && !hasTeam) {
        document.getElementById('pendingList').innerHTML = '<div class="card text-center" style="padding:3rem">'
          + '<p style="color:var(--danger);font-size:1.1rem;display:flex;align-items:center;justify-content:center;gap:0.5rem"><i data-lucide="shield-alert"></i> ไม่มีสิทธิ์เข้าถึง</p>'
          + '<p style="color:var(--text3);margin-top:0.5rem">คุณไม่มีสิทธิ์ในการจัดการหรืออนุมัติใบเบิกสินค้า</p>'
          + '<button class="btn btn-primary" style="margin-top:1rem" onclick="navigateTo(\'login.html\')">เข้าสู่ระบบ</button></div>';
        refreshIcons();
        return;
      }

      if (currentUser) {
        document.getElementById('mgrName').textContent = currentUser.name;

        // ปุ่ม Admin (ถ้ามีสิทธิ์จัดการสินค้า/คลัง)
        var canAdmin = API.hasPermission(API.PERMS.MANAGE_PRODUCTS) || API.hasPermission(API.PERMS.MANAGE_INVENTORY);
        var adBtn = document.getElementById('adminPaneBtn');
        var adMob = document.getElementById('mgrMobileAdmin');
        if (canAdmin) {
          if (adBtn) adBtn.classList.remove('hidden');
          if (adMob) adMob.classList.remove('hidden');
        }
      }
      loadPending();
      startAppPolling();
      refreshIcons();
    }

    // ─── SMART POLLING ────────────────────────────────────────
    function startAppPolling() {
      if (typeof API !== 'undefined' && API.startSmartPolling) {
        API.startSmartPolling(5000, function(newVersion) {
          console.log('Manager data version changed to ' + newVersion + ', refreshing data...');
          // [FIX] Soft reload: refresh pending list without destroying user state
          API.invalidateCache();
          loadPending();
          showToast('ข้อมูลมีการอัปเดตจากระบบ', 'info');
        });
      }
    }

    function mgrLogout() {
      if (!confirm('ยืนยันการออกจากระบบผู้อนุมัติ?')) return;
      localStorage.removeItem('_user');
      localStorage.removeItem('_tok');
      navigateTo('login.html');
    }

    function loadPending() {
      var list = document.getElementById('pendingList');
      list.innerHTML = Array(3).fill('<div class="skeleton-card skeleton">'
        + '<div class="skeleton-image skeleton" style="height:60px;width:60px"></div>'
        + '<div class="skeleton-title skeleton"></div>'
        + '<div class="skeleton-title skeleton" style="width:60%"></div>'
        + '<div class="skeleton-price skeleton"></div>'
        + '</div>').join('');


      API.getManagerBatchData().then(function (batch) {
        var list = document.getElementById('pendingList');
        if (!batch.success || !batch.pending || batch.pending.data.length === 0) {
          list.innerHTML = '<div class="card text-center" style="padding:3rem;color:var(--text3);display:flex;align-items:center;justify-content:center;gap:0.5rem"><i data-lucide="check-circle"></i> ไม่มีใบเบิกรออนุมัติ</div>';
          return;
        }

        var res = batch.pending;
        list.innerHTML = res.data.map(function (o) {
          return '<div class="card" style="margin-bottom:1rem">'
            + '<div class="flex flex-wrap items-center justify-between gap-2" style="margin-bottom:0.75rem">'
            + '<div><span style="font-weight:600">' + escapeHTML(o.orderId) + '</span>'
            + ' <span class="badge badge-pending">' + escapeHTML(o.statusLabel || o.status) + '</span></div>'
            + '<div style="color:var(--text3);font-size:0.8rem">' + escapeHTML(String(o.createdAt || '').split(' ')[0]) + '</div>'
            + '</div>'
            + '<div style="font-size:0.9rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem"><i data-lucide="user" style="width:14px;height:14px"></i> ผู้เบิก: <strong>' + escapeHTML(o.employeeName || o.employeeId) + '</strong></div>'
            + '<div style="font-size:0.9rem;margin-bottom:0.5rem;display:flex;align-items:center;gap:0.4rem"><i data-lucide="building" style="width:14px;height:14px"></i> แผนก: ' + escapeHTML(o.department) + '</div>'
            + '<div style="font-size:1.1rem;font-weight:700;color:var(--accent);margin-bottom:1rem;display:flex;align-items:center;gap:0.4rem"><i data-lucide="banknote" style="width:18px;height:18px"></i> ฿' + Number(o.totalAmount).toLocaleString() + '</div>'
            + '<div class="flex flex-wrap gap-1">'
            + '<button class="btn btn-accent btn-sm" onclick="openDecision(\'' + escapeHTML(o.orderId) + '\', \'approve\')"><i data-lucide="check-circle" style="width:14px;height:14px"></i> อนุมัติ</button>'
            + '<button class="btn btn-danger btn-sm" onclick="openDecision(\'' + escapeHTML(o.orderId) + '\', \'reject\')"><i data-lucide="x-circle" style="width:14px;height:14px"></i> ไม่อนุมัติ</button>'
            + '<button class="btn btn-outline btn-sm" onclick="viewItems(\'' + escapeHTML(o.orderId) + '\')"><i data-lucide="eye" style="width:14px;height:14px"></i> ดูรายการ</button>'
            + '</div>'
            + '</div>';
        }).join('');
        refreshIcons();
      }).catch(function (err) {
        showToast('ไม่สามารถโหลดข้อมูลใบเบิกได้: ' + err, 'error');
        if (list) list.innerHTML = '<div class="card text-center" style="padding:3rem">'
          + '<div style="width:56px;height:56px;border-radius:50%;background:rgba(248,113,113,0.1);display:flex;align-items:center;justify-content:center;margin:0 auto 1rem"><i data-lucide="wifi-off" style="width:28px;height:28px;color:var(--danger)"></i></div>'
          + '<p style="font-weight:700;font-size:1.1rem;margin-bottom:0.5rem">ไม่สามารถเชื่อมต่อได้</p>'
          + '<p style="color:var(--text3);font-size:0.85rem;margin-bottom:1.5rem">เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง</p>'
          + '<button class="btn btn-primary" onclick="loadPending()" style="margin:0 auto"><i data-lucide="refresh-cw" style="width:16px;height:16px"></i> ลองใหม่อีกครั้ง</button>'
          + '</div>';
        refreshIcons();
      });
    }

    function viewItems(orderId) {
      pendingDecision = null;
      document.getElementById('decisionTitle').textContent = 'รายละเอียดใบเบิก ' + orderId;
      document.getElementById('decisionComment').parentElement.style.display = 'none';
      document.getElementById('decisionBtn').style.display = 'none';
      var itemsDiv = document.getElementById('decisionItems');
      itemsDiv.innerHTML = '<div class="spinner"></div>';
      document.getElementById('decisionModal').classList.add('open');

      API.getOrderItems(orderId).then(function (res) {
        if (!res.success || res.data.length === 0) {
          itemsDiv.innerHTML = '<p style="color:var(--text3)">ไม่พบรายการ</p>'; return;
        }
        itemsDiv.innerHTML = '<div class="table-wrap"><table><thead><tr><th>สินค้า</th><th>จำนวน</th><th>ราคา</th></tr></thead><tbody>'
          + res.data.map(function (i) {
            return '<tr><td>' + i.productName + '</td><td>' + i.quantity + '</td><td>฿' + Number(i.price).toLocaleString() + '</td></tr>';
          }).join('') + '</tbody></table></div>';
      }).catch(function (err) {
        itemsDiv.innerHTML = '<p style="color:var(--danger)">เกิดข้อผิดพลาดในการโหลดรายการ</p>';
        showToast('โหลดรายการไม่สำเร็จ: ' + err, 'error');
      });
    }

    function openDecision(orderId, action) {
      pendingDecision = { orderId: orderId, action: action };
      document.getElementById('decisionTitle').innerHTML = action === 'approve'
        ? '<i data-lucide="check-circle"></i> อนุมัติใบเบิก ' + orderId
        : '<i data-lucide="x-circle"></i> ไม่อนุมัติใบเบิก ' + orderId;
      document.getElementById('decisionComment').parentElement.style.display = '';
      document.getElementById('decisionComment').value = '';
      document.getElementById('decisionBtn').style.display = '';
      document.getElementById('decisionBtn').className = action === 'approve' ? 'btn btn-accent' : 'btn btn-danger';
      document.getElementById('decisionBtn').innerHTML = action === 'approve'
        ? '<i data-lucide="check"></i> ยืนยันอนุมัติ'
        : '<i data-lucide="x"></i> ยืนยันไม่อนุมัติ';
      document.getElementById('decisionItems').innerHTML = '';
      document.getElementById('decisionModal').classList.add('open');
      refreshIcons();
    }

    function closeMgrModal() {
      document.getElementById('decisionModal').classList.remove('open');
      pendingDecision = null;
    }

    function submitDecision() {
      if (!pendingDecision) return;
      var comment = document.getElementById('decisionComment').value;
      var btn = document.getElementById('decisionBtn');
      btn.disabled = true;
      btn.innerHTML = '<div class="spinner"></div>';

      var promise = pendingDecision.action === 'approve'
        ? API.approveRequest(pendingDecision.orderId, comment)
        : API.rejectRequest(pendingDecision.orderId, comment);


      promise.then(function (res) {
        showToast(res.message || (res.success ? 'สำเร็จ' : res.error), res.success ? 'success' : 'error');
        closeMgrModal();
        loadPending();
      }).catch(function (err) {
        showToast('เกิดข้อผิดพลาด: ' + (typeof err === 'string' ? err : (err.message || err)), 'error');
        btn.disabled = false;
        btn.textContent = 'ลองใหม่';
      });
    }

    function showToast(msg, type) {
      var container = document.getElementById('toastContainer');
      var t = document.createElement('div');
      t.className = 'toast ' + (type || 'success');

      var icon = 'check-circle';
      if (type === 'error') icon = 'alert-circle';
      if (type === 'warning') icon = 'alert-triangle';

      t.innerHTML = '<i data-lucide="' + icon + '" style="width:18px;height:18px"></i>'
        + '<span>' + escapeHTML(msg) + '</span>';

      container.appendChild(t);
      refreshIcons();
      setTimeout(function () { t.remove(); }, 4000);
    }

  </script>

  <!-- Back to Top Button -->
  <button id="backToTopBtn" class="btn btn-primary"
    style="position:fixed; bottom:2rem; right:2rem; border-radius:50%; width:50px; height:50px; display:none; align-items:center; justify-content:center; box-shadow:var(--shadow-lg); z-index:1200; padding:0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1)"
    onclick="window.scrollTo({top:0, behavior:'smooth'})" title="กลับขึ้นด้านบน">
    <i data-lucide="arrow-up" style="width:24px;height:24px"></i>
  </button>
  <script>
    window.addEventListener('scroll', function () {
      var btn = document.getElementById('backToTopBtn');
      if (btn) {
        if (window.scrollY > 300) {
          btn.style.display = 'flex';
          btn.style.opacity = '1';
        } else {
          btn.style.display = 'none';
          btn.style.opacity = '0';
        }
      }
    });
  </script>
</body>

</html>

<!DOCTYPE html>
<html lang="th">

<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Live QR Scanner | EMETIX STORE</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/lucide@latest" defer></script>

  <style>
    :root {
      --bg: #050510;
      --bg-surface: #12121e;
      --primary: #fbbf24;
      --primary-dark: #d97706;
      --accent: #10b981;
      --danger: #ef4444;
      --text: #ffffff;
      --text-dim: #94a3b8;
      --glass: rgba(18, 18, 30, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ══════════════════════════════════════════
       HEADER
    ══════════════════════════════════════════ */
    .app-header {
      padding: 1.25rem;
      background: var(--glass);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 800;
      font-size: 1.1rem;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
    }

    /* ══════════════════════════════════════════
       SCANNER VIEW
    ══════════════════════════════════════════ */
    .scanner-viewport {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #reader {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Scanner UI Overlay */
    .scanner-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .scan-region {
      width: 260px;
      height: 260px;
      position: relative;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6);
    }

    /* Pulsing corners */
    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border: 4px solid var(--primary);
      border-radius: 4px;
    }
    .t-l { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .t-r { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .b-l { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .b-r { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Laser line animation */
    .laser-line {
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 2px;
      background: var(--primary);
      box-shadow: 0 0 12px var(--primary);
      animation: scanMove 2.5s infinite ease-in-out;
      opacity: 0.8;
    }

    @keyframes scanMove {
      0%, 100% { top: 10%; opacity: 0.3; }
      50% { top: 90%; opacity: 1; }
    }

    /* ══════════════════════════════════════════
       CONTROLS
    ══════════════════════════════════════════ */
    .controls-panel {
      padding: 1.5rem;
      background: var(--bg-surface);
      border-top: 1px solid var(--glass-border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .status-badge {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-dim);
      padding: 0.5rem;
      background: var(--glass);
      border-radius: 99px;
      margin-bottom: 0.5rem;
    }

    .btn-group {
      display: flex;
      gap: 0.75rem;
    }

    .btn {
      flex: 1;
      padding: 0.85rem 1rem;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--primary); color: #000; box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }
    .btn-outline { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text); }
    .btn-danger { background: var(--danger); color: white; }
    
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:active:not(:disabled) { transform: scale(0.96); }

    /* ══════════════════════════════════════════
       SUCCESS OVERLAY
    ══════════════════════════════════════════ */
    .success-screen {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(10, 10, 22, 0.95);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      text-align: center;
      padding: 2rem;
      animation: fadeIn 0.3s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .check-icon {
      width: 64px;
      height: 64px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 1.5rem;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>

<body>
  <header class="app-header">
    <div class="logo">
      <div class="logo-icon">QR</div>
      <span>EMETIX <span style="color:var(--primary); font-weight:300">SCANNER</span></span>
    </div>
    <button class="btn btn-outline" style="flex:none; padding: 0.5rem 0.75rem; font-size: 0.8rem;" onclick="window.close()">ปิด</button>
  </header>

  <main class="scanner-viewport">
    <div id="reader"></div>
    
    <!-- Overlay UI -->
    <div class="scanner-overlay" id="scannerOverlay">
      <div class="scan-region">
        <div class="corner t-l"></div>
        <div class="corner t-r"></div>
        <div class="corner b-l"></div>
        <div class="corner b-r"></div>
        <div class="laser-line"></div>
      </div>
      <p style="margin-top: 2rem; font-size: 0.9rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">
        ส่องกล้องไปที่ QR Code หรือ Barcode
      </p>
    </div>

    <!-- Success Screen -->
    <div id="successScreen" class="success-screen">
      <div class="check-icon"><i data-lucide="check" style="width:32px;height:32px;color:white"></i></div>
      <h2 style="margin: 0 0 0.5rem; font-weight: 800;">สแกนสำเร็จ!</h2>
      <p id="resultText" style="color: var(--primary); font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem;"></p>
      <p style="color: var(--text-dim); font-size: 0.85rem;">กำลังบันทึกข้อมูลและปิดหน้าต่างนี้...</p>
    </div>
  </main>

  <footer class="controls-panel">
    <div id="status" class="status-badge">กดปุ่มเริ่มสแกนเพื่อเปิดกล้อง</div>
    
    <div class="btn-group">
      <button id="startBtn" class="btn btn-primary" onclick="startScanner()">
        <i data-lucide="camera"></i> เริ่มสแกนสด
      </button>
      <button id="stopBtn" class="btn btn-danger" onclick="stopScanner()" style="display:none">
        <i data-lucide="square"></i> หยุดสแกน
      </button>
    </div>

    <div style="display:flex; align-items:center; gap:0.75rem; color:var(--text-dim); font-size: 0.8rem; margin: 0.5rem 0;">
      <hr style="flex:1; border:none; border-top:1px solid var(--glass-border)">
      <span>หรือสแกนจากไฟล์</span>
      <hr style="flex:1; border:none; border-top:1px solid var(--glass-border)">
    </div>

    <div class="btn-group">
      <button class="btn btn-outline" onclick="document.getElementById('file-input').click()">
        <i data-lucide="image"></i> เลือกรูปภาพ
      </button>
    </div>
  </footer>

  <!-- Hidden file input for fallback -->
  <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleFile(this)">

  <script>
    const html5QrCode = new Html5Qrcode("reader");
    const statusEl = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const overlay = document.getElementById('scannerOverlay');

    // Display mode info if provided
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode');
    if (mode) {
      let modeLabel = '';
      if (mode === 'deduct') modeLabel = '<i data-lucide="log-out"></i> โหมด: นำสินค้าออก';
      if (mode === 'receive') modeLabel = '<i data-lucide="log-in"></i> โหมด: รับสินค้าเข้า';
      if (mode === 'sub') modeLabel = '<i data-lucide="package"></i> โหมด: คลังย่อย';
      if (modeLabel) statusEl.innerHTML = '<div style="color:var(--primary); display:flex; align-items:center; justify-content:center; gap:0.5rem; font-weight:700">' + modeLabel + '</div><div style="margin-top:0.25rem">กดปุ่มเริ่มสแกนเพื่อเปิดกล้อง</div>';
      refreshIcons();
    }

    // สำหรับใช้เป็น fallback ถ้ากล้องสดเปิดไม่ได้
    function handleFile(input) {
      if (!input.files || input.files.length === 0) return;
      statusEl.innerHTML = '⏳ กำลังวิเคราะห์รูปภาพ...';

      html5QrCode.scanFile(input.files[0], true)
        .then(decodedText => onScanSuccess(decodedText))
        .catch(err => {
          statusEl.innerHTML = '<span style="color:var(--danger); display:flex; align-items:center; justify-content:center; gap:0.4rem"><i data-lucide="alert-circle" style="width:16px;height:16px"></i> ไม่พบรหัสในรูปภาพนี้</span>';
          refreshIcons();
        });
      input.value = '';
    }

    function startScanner() {
      startBtn.disabled = true;
      startBtn.innerHTML = '⏳ กำลังเปิดกล้อง...';
      statusEl.innerHTML = 'กรุณากด "อนุญาต" (Allow) เพื่อเข้าถึงกล้อง';

      const config = { 
        fps: 15, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0 
      };

      html5QrCode.start(
        { facingMode: "environment" }, 
        config,
        (decodedText) => {
          onScanSuccess(decodedText);
          stopScanner(); // หยุดทันทีที่เจอ
        },
        (errorMessage) => {
          // ignore failures while scanning
        }
      )
      .then(() => {
        statusEl.innerHTML = '🔵 กำลังสแกนสด...';
        startBtn.style.display = 'none';
        stopBtn.style.display = 'flex';
        overlay.style.display = 'flex';
      })
      .catch(err => {
        console.error(err);
        startBtn.disabled = false;
        startBtn.innerHTML = '<i data-lucide="camera"></i> เริ่มสแกนสด';
        statusEl.innerHTML = '<span style="color:var(--danger); display:flex; align-items:center; justify-content:center; gap:0.4rem"><i data-lucide="alert-circle" style="width:16px;height:16px"></i> ไม่สามารถเปิดกล้องได้</span>';
        refreshIcons();
        alert('ไม่สามารถเปิดใช้งานกล้องได้: ' + err);
      });
    }

    function stopScanner() {
      html5QrCode.stop().then(() => {
        startBtn.style.display = 'flex';
        startBtn.disabled = false;
        startBtn.innerHTML = '<i data-lucide="camera"></i> เริ่มสแกนสด';
        stopBtn.style.display = 'none';
        overlay.style.display = 'none';
        statusEl.innerHTML = 'หยุดการสแกนแล้ว';
        refreshIcons();
      }).catch(err => {
        console.warn("Unable to stop scanner", err);
      });
    }

    function onScanSuccess(decodedText) {
      // แสดงหน้าจอสำเร็จ
      const successScreen = document.getElementById('successScreen');
      const resultText = document.getElementById('resultText');
      
      resultText.innerText = decodedText;
      successScreen.style.display = 'flex';

      // บันทึกข้อมูล
      const scanData = {
        text: decodedText,
        timestamp: Date.now()
      };
      localStorage.setItem('_qr_scan_res', JSON.stringify(scanData));

      // ส่ง postMessage สำรอง
      if (window.opener) {
        try { window.opener.postMessage({ type: 'QR_SCAN_RESULT', text: decodedText }, "*"); } catch(e) {}
      }

      // ปิดหน้าจออัตโนมัติ
      setTimeout(() => {
        window.close();
      }, 1500);
    }
    function refreshIcons() { if (typeof lucide !== 'undefined') lucide.createIcons(); }
    window.onload = function() { refreshIcons(); }
  </script>
</body>
</html>
